name: Build and Release TermX Mobile APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble TermX APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/TermX-Mobile-${TAG_NAME}-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/TermX-Mobile-${TAG_NAME}-debug.apk
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermX-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermX-Release-APK
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TermX Mobile ${{ github.ref_name }}
          body: |
            # TermX Mobile ${{ github.ref_name }} 正式发布

            TermX Mobile 是一款专为 Android 移动平台打造的现代、高性能终端仿真器与 SSH/SFTP 运维客户端。基于 Kotlin + Jetpack Compose 纯原生架构设计。

            > **Powered by codywon**

            ### 🚀 首发核心特性
            - **高性能 Canvas 终端引擎**：硬件加速渲染、140 列等宽宽屏漫游、VT100 Pending Wrap 规范折行与无损矩阵缩放。
            - **流体手势快捷键与宏卡片**：支持物理吸附拖拽排序，默认配备高频 `Ctrl+C`、`Ctrl+V` 与三模输入切换。
            - **高可靠 SFTP 引擎**：Coroutine Mutex 互斥防踩踏机制、纯内存流式安全读写、毫秒级面包屑导航与在线文本编辑。
            - **连接自愈与系统级保活**：心跳保活检测、透明重连看门狗、前台服务守护及原生电池优化豁免。
            - **统一安全凭据库 (Vault)**：集中式凭据加密管理，支持 Ed25519 / RSA / ECDSA 私钥与密码复用。
            - **离线运维速查手册**：内置常用 Linux / Docker / 网络运维命令，支持即时模糊搜索与单键复制。

            ### 📦 安装包下载
            - **Release 正式版 APK**：`TermX-Mobile-${{ github.ref_name }}-release.apk` (推荐安装)
            - **Debug 调试版 APK**：`TermX-Mobile-${{ github.ref_name }}-debug.apk`

            ---
            *仅供个人学习与交流使用，严禁商业用途。*
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
