name: Build and Release TermX Mobile APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble TermX APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/TermX-Mobile-${TAG_NAME}-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/TermX-Mobile-${TAG_NAME}-debug.apk
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermX-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermX-Release-APK
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TermX Mobile ${{ github.ref_name }}
          body: |
            # TermX Mobile ${{ github.ref_name }} 正式发布

            TermX Mobile 是一款专为 Android 移动平台打造的高性能终端仿真器、SSH/SFTP 运维工具与掌上自主 SRE 运维智能体。基于 Kotlin + Jetpack Compose 纯原生架构设计。

            > **Powered by codywon**

            ### 🚀 核心特性与架构亮点
            - **🤖 自主 SRE 运维智能体 (Pi-Agent)**：纯粹 ReAct 循环，深度感知目标系统环境（发行版/架构/包管理器/服务），按需下发 Bash 运维诊断命令。
            - **🛡️ 生产级安全审批防线 (Human-in-the-Loop)**：严格正则拦截 `rm -rf`、关机、清空防火墙等高危操作，强制弹出人工审批卡片。
            - **🌐 双通道极简联网检索**：内置必应 Bing CN 与 DuckDuckGo HTML，免搜索 API Key 即可实时排查 Linux/Docker 报错。
            - **💻 高性能 Canvas 终端引擎**：硬件加速渲染、140 列等宽宽屏漫游、VT100 Pending Wrap 规范折行与无损矩阵手势缩放。
            - **⌨️ 流体手势快捷键与宏卡片**：网格拖拽物理吸附让位，默认配备高频 `Ctrl+C`、`Ctrl+V` 与三模输入快速切换。
            - **📁 并发安全 SFTP 引擎**：Coroutine Mutex 互斥排队机制、纯内存流式安全读写、毫秒级面包屑导航与全屏在线文本编辑。
            - **⚡ 连接自愈与后台长连守护**：心跳保活检测、透明重连看门狗、前台服务守护及原生电池优化豁免。

            ### 📦 安装包下载
            - **Release 正式版 APK**：`TermX-Mobile-${{ github.ref_name }}-release.apk` (推荐安装)
            - **Debug 调试版 APK**：`TermX-Mobile-${{ github.ref_name }}-debug.apk`

            ---
            *仅供个人学习与交流使用，严禁商业用途。*
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
