name: Build and Release TeamX Mobile APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble TeamX APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/TeamX-Mobile-${TAG_NAME}-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/TeamX-Mobile-${TAG_NAME}-debug.apk
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeamX-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeamX-Release-APK
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TeamX Mobile ${{ github.ref_name }}
          body: |
            ## 🎉 TeamX Mobile ${{ github.ref_name }} 正式发布！
            
            基于现代纯原生架构打造的 **TeamX Mobile** Android SSH 客户端与终端工具，采用 Kotlin + Jetpack Compose (Material 3)。

            ### 🚀 核心特性与最新优化：
            - **现代极客暗黑主题**：`#0B141C` 沉浸底色，`#67DF70` 翡翠荧光绿，`#A2C9FF` 冰蓝次强调色。
            - **高吞吐终端渲染节流引擎**：引入 30ms 帧率调度与动态合并缓冲，彻底解决远程服务器编译大工程、长日志刷屏卡死与键盘无响应问题。
            - **全功能三模辅助键盘（输入法 / 快捷键 / 电脑键盘）**：
              - 默认保持精致极简单行按键条；
              - ⚡ 快捷键面板：一键唤起常用 Linux 控制信号与指令宏；
              - 💻 电脑键盘面板：完整提供 F1-F12、Insert、Delete、PageUp/Down、Home/End、全向箭头键，移动端运维如同面对实体 PC 键盘。
            - **全屏沉浸式在线文本编辑器**：原生沉浸式 Window Insets 适配，键盘隐藏后即时平滑归位，告别弹窗悬空与底部留白，支持在线修改保存、下载与本地上传。
            - **全页面防挤压排版加固**：全面消灭 Host 卡片 Tag 换行（如 Production 拆行）、芯片折行与文字挤压。
            - **沉浸式状态栏适配**：顶部状态栏安全避让，彻底解决水滴/挖孔屏与 Tab 标签栏重合问题。
            - **中文等宽渲染引擎**：全面支持中文字符与全角符号排版，彻底解决汉字重叠与错位。
            - **现代算法全套支持**：集成高版本 BouncyCastle 提供者，原生支持 `X25519`、`Ed25519`、`curve25519-sha256`。
            - **Port Forwarding 端口转发与 SSH 隧道调度**：支持本地端口转发（Local Port Forwarding）与实时状态监控。
            - **Hosts & Clusters 主机管理**：分类 Chips 标签过滤、实时搜索与资产卡片。
            - **SFTP 文件浏览器**：逐级面包屑导航、文件上传、下载、在线编辑、重命名与删除。
            
            ### 📱 安装包下载：
            - **Release 正式版 APK**：下载附件中的 `TeamX-Mobile-${{ github.ref_name }}-release.apk`
            - **Debug 调试版 APK**：下载附件中的 `TeamX-Mobile-${{ github.ref_name }}-debug.apk`
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
