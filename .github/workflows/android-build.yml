name: Build and Release TermX Mobile APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble TermX APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/TermX-Mobile-${TAG_NAME}-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/TermX-Mobile-${TAG_NAME}-debug.apk
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermX-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermX-Release-APK
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TermX Mobile ${{ github.ref_name }}
          body: |
            # TermX Mobile ${{ github.ref_name }} 正式发布

            一款专为移动端设计的现代、轻量、高性能 Android 原生 SSH 客户端与服务器运维工具。采用 Kotlin + Jetpack Compose (Material 3) 纯原生架构构建。

            > **Powered by codywon**

            ### 🌟 核心特性与架构亮点
            - **高性能 VT100 / xterm 终端引擎**：硬件加速 Canvas 渲染、Pending Wrap 规范折行、140 列宽屏漫游与丝滑双指缩放。
            - **全新丝滑拖拽重排与高频快捷键**：网格拖拽物理吸附让位，默认首行高频配备 `Ctrl+C (中断/复制)` 与 `Ctrl+V (粘贴剪贴)`。
            - **SFTP 远程文件管理**：远程面包屑导航、文件极速上传下载与全屏在线文本编辑。
            - **生产运维速查手册 (Cheatsheet)**：涵盖 Linux、Docker、网络、系统服务等高频常用命令。
            - **Vault 凭据库与长连守护**：支持 Ed25519、RSA 等多种加密密钥，原生电池优化白名单守护后台保活。

            ### 📱 安装包下载
            - **Release 正式版 APK**：下载附件中的 `TermX-Mobile-${{ github.ref_name }}-release.apk`
            - **Debug 调试版 APK**：下载附件中的 `TermX-Mobile-${{ github.ref_name }}-debug.apk`

            ---
            *仅供个人学习与交流使用，严禁商业用途。*
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
