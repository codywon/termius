name: Build and Release TermX Mobile APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble TermX APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/TermX-Mobile-${TAG_NAME}-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/TermX-Mobile-${TAG_NAME}-debug.apk
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermX-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermX-Release-APK
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TermX Mobile ${{ github.ref_name }}
          body: |
            ## 🎉 TermX Mobile ${{ github.ref_name }} 正式发布！
            
            基于现代纯原生架构打造的 **TermX Mobile** Android SSH 客户端与终端运维工具，采用 Kotlin + Jetpack Compose (Material 3)。
            
            ### 🚀 最新特性与核心优化 (v1.0.4)：
            - **快捷键交互革命性重构 (全面杜绝误触)**：
              - **彻底移除反人类的左右小箭头**：废弃挤在卡片底部极易误按的微型左右按键，卡片内部恢复干净纯粹；
              - **手柄自由拖拽排序 (Drag and Drop Reordering)**：卡片右下角提供专属拖动手柄（`DragHandle`），按住即可在网格中自由拖拽平滑交换位置，配合精准物理震动反馈；
              - **全方位支持快捷键二次编辑**：
                - 普通使用时：**长按任意快捷键卡片**，立即呼出操作菜单（【✏️ 编辑快捷键】、【 拖拽排序】、【🗑️ 删除快捷键】）；
                - 管理模式下：卡片左下角配备醒目的“编辑铅笔”标识，轻触卡片任意非删除区域直接打开编辑弹窗；
                - 支持修改指令名称、中文注释、执行命令文本、以及是否自动追加回车（Enter）；
              - **自适应深浅色主题**：编辑弹窗与快捷键卡片全面统一采用全局主题配色体系，浅色与深色模式皆浑然天成。
            
            ### 🛠️ 历史版本核心特性 (v1.0.3 及更早)：
            - **底栏高度轻量紧凑化重构 (52dp 极简微胶囊底栏)**：
              - 紧凑压缩至 52dp 现代微胶囊底栏，配合 0.5dp 雅致微分割线，大幅释放手机可视面积约 35%。
            - **健全断线重连（Auto-Reconnect）与网络守护机制**：
              - **智能断线自动重试**：遇到网络闪断自动在 3 秒后尝试重连（最多重试 3 次），控制台实时输出醒目重试日志；
              - **顶栏状态动态按钮**：连接中显示红色断开电源，断开后实时变为高亮翠绿色刷新按钮，支持一键极速重连；
              - **全方位便捷一键重连入口**：已断开时终端顶部悬浮微型重连胶囊条，Tab 标签点击亦可秒级一键重连。
            - **系统电池优化与后台常驻保护 (Doze 模式豁免)**：
              - 设置页新增【系统电池优化 (后台保活核心)】状态检测与一键申请豁免；
              - 支持一键调起原生白名单授权，并提供涵盖小米澎湃、华为、OPPO、vivo、原生安卓的自启动与后台加锁详细指南。
            - **全面重构地道专业中文本地化**：
              - 全面审视并剔除机翻、生硬不伦不类的中文表达，统一规范为专业运维术语；
              - 完善各界面中英文双语无缝切换，消除挤压折行与卡片不对称。
            - **全自由终端字体大小调节 (Terminal Font Size)**：
              - 设置页新增终端字号步进调节与 5 大快捷档位 Chip（11sp ~ 20sp）；
              - 提供实时终端代码输出预览盒，字号调节即刻同步并全局持久化。
            - **精简 4 大核心 Tab 架构**：
              - 💻【主机 (Hosts)】：服务器资产管理、多标签过滤与 SSH 极速直连；
              - 📁【文件 (SFTP)】：远程目录面包屑浏览、文件上传下载、全屏在线文本编辑与重命名删除；
              - 📖【速查 (Cheatsheet)】：全新运维速查手册，内置 30+ 条生产常用命令，支持一键复制与自定义扩展；
              - ⚙️【设置 (Settings)】：统一全局设置中心，整合 SSH 凭据管理、4 套极客主题配色、终端字号、电池后台保活、关于与更新。
            - **4 套终端极客主题配色即时换肤**：黑曜石翡翠、极客冰蓝、复古琥珀、赛博霓虹紫。
            - **网易 UU 远程同款三模辅助交互系统**：输入法、快捷键、电脑键盘三模随心切换。
            - **多通道并发测速自动更新引擎**：聚合国内 5 大开源镜像通道，1200ms 并发 HEAD 竞速选优，低速看门狗自动切线。
            - **现代算法全套支持**：原生支持 `X25519`、`Ed25519`、`curve25519-sha256`。
            
            ### 📱 安装包下载：
            - **Release 正式版 APK**：下载附件中的 `TermX-Mobile-${{ github.ref_name }}-release.apk`
            - **Debug 调试版 APK**：下载附件中的 `TermX-Mobile-${{ github.ref_name }}-debug.apk`
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
