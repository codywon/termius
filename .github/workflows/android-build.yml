name: Build and Release TermX Mobile APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble TermX APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/TermX-Mobile-${TAG_NAME}-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/TermX-Mobile-${TAG_NAME}-debug.apk
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermX-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermX-Release-APK
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Generate Dynamic Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: changelog
        run: |
          TAG_NAME="${{ github.ref_name }}"
          # 提取 tag 注释信息 (去掉多余空行)
          TAG_MSG=$(git tag -l --format='%(contents)' "$TAG_NAME" 2>/dev/null | sed '/^$/d' | head -n 12)
          
          # 获取从上一个 tag 到当前 tag 的精简 commit 变动 (优先筛选 feat/fix/perf/refactor)
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..${TAG_NAME}" --pretty=format:"- %s" --no-merges 2>/dev/null | grep -E '^\- (feat|fix|perf|refactor)' || git log "${PREV_TAG}..${TAG_NAME}" --pretty=format:"- %s" --no-merges 2>/dev/null | head -n 8)
          else
            COMMITS=$(git log -n 8 --pretty=format:"- %s" --no-merges 2>/dev/null)
          fi

          cat << 'EOF' > release_notes.md
          ### 💡 本次版本核心更新与优化 (${{ github.ref_name }})
          EOF

          if [ -n "$TAG_MSG" ]; then
            echo "" >> release_notes.md
            echo "$TAG_MSG" >> release_notes.md
          fi

          if [ -n "$COMMITS" ]; then
            echo "" >> release_notes.md
            echo "#### 📝 详细改动列表" >> release_notes.md
            echo "$COMMITS" >> release_notes.md
          fi

          cat << 'EOF' >> release_notes.md

          ---
          *TermX Mobile · 掌上自主 SRE 运维智能体*
          EOF

      - name: Create GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TermX Mobile ${{ github.ref_name }}
          body_path: release_notes.md
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
